name: Daten täglich aktualisieren

on:
  schedule:
    # täglich um 04:17 UTC (05:17 Uhr Wien im Winter, 06:17 Uhr im Sommer)
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Daten holen
        run: node scripts/update-data.mjs

      - name: Änderungen speichern
        run: |
          if git diff --quiet -- index.html data/live.json; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html data/live.json
          git commit -m "Daten automatisch aktualisiert ($(date -u +%Y-%m-%d))"
          git push
