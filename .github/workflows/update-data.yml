name: Daten täglich aktualisieren

on:
  schedule:
    # täglich um 04:17 UTC (05:17 Uhr Wien im Winter, 06:17 Uhr im Sommer)
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Alle Daten neu holen (auch die F1-Karrierestatistik)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Daten holen
        env:
          FORCE_ALL: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: node scripts/update-data.mjs

      - name: Änderungen speichern
        run: |
          if git diff --quiet -- index.html data/live.json; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html data/live.json
          git commit -m "Daten automatisch aktualisiert ($(date -u +%Y-%m-%d))"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
