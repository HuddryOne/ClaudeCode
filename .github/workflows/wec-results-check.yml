name: WEC-Ergebnisse prüfen (temporär)

# Einmaliger Prüf-Workflow (Roadmap Punkt 3): Sind die öffentlichen Ergebnisdokumente
# der FIA WEC auf fiawec.alkamelsystems.com automatisch abrufbar und auslesbar?
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Startseite, robots.txt und Dokumentlinks
        run: |
          BASE="https://fiawec.alkamelsystems.com"
          echo "== robots.txt"; curl -sS -m 30 "$BASE/robots.txt" | head -30 || true
          echo "== Startseite"; curl -sS -m 30 -D h.txt -o home.html "$BASE/" ; head -15 h.txt; wc -c home.html
          echo "== Saisons/Events (Auswahl)"; grep -oE '(season|evvent|event)=[^"&]+' home.html | sort -u | head -40
          echo "== Links auf Dokumente"; grep -oiE 'href="[^"]+\.(pdf|csv|json)"' home.html | head -40
          grep -oiE 'href="[^"]*Results[^"]*"' home.html | head -40
      - name: Saison 2026, letztes Event (Monza)
        run: |
          BASE="https://fiawec.alkamelsystems.com"
          for q in "?season=26_2026" "?season=26_2026&evvent=08_MONZA" ; do
            echo "== $q"; curl -sS -m 30 -o page.html "$BASE/$q"; wc -c page.html
            grep -oiE '(href|value)="[^"]*(MONZA|Monza)[^"]*"' page.html | sort -u | head -60
          done
          echo "== Dokumente Monza"; grep -oiE 'href="[^"]+\.(pdf|csv)"' page.html | sort -u | head -80
          CSV=$(grep -oiE 'href="[^"]+Classification[^"]*Race[^"]*\.csv"' page.html | head -1 | sed -E 's/^href="//; s/"$//')
          [ -z "$CSV" ] && CSV=$(grep -oiE 'href="[^"]+\.csv"' page.html | head -1 | sed -E 's/^href="//; s/"$//')
          echo "== Beispiel-CSV: $CSV"
          if [ -n "$CSV" ]; then case "$CSV" in http*) U="$CSV";; /*) U="$BASE$CSV";; *) U="$BASE/$CSV";; esac
            curl -sS -m 30 -D ch.txt -o sample.csv "$U"; head -12 ch.txt; head -15 sample.csv; fi
